name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Attach the installers to a GitHub release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # No developer certificate yet, so macOS falls back to the ad-hoc identity
      # configured in electron-builder.yml; see the README's install notes.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    strategy:
      # One platform failing should not hide whether the others are shippable.
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-14
          # The last Intel image Actions offers; x86_64 support ends in 2027.
          - label: macOS (Intel)
            os: macos-15-intel
          - label: Windows x64
            os: windows-latest
          - label: Linux x64
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # The Harness's native modules are compiled here, so this must be the same
      # Node major as the runtime the installer bundles.
      - name: Read the pinned Node version
        id: pins
        shell: bash
        run: echo "node=$(node -p "require('./package.json').dshDesktop.nodeVersion")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.pins.outputs.node }}

      - name: Install shell dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Prepare the bundled payloads
        run: npm run prepare:payload

      # Signing and the DMG step open every file in the payload at once. The
      # runners start at a 256-descriptor soft limit, and raising only that is not
      # enough: the kernel's per-process cap overrides it, so lift both.
      - name: Build installers
        if: runner.os == 'macOS'
        run: |
          sudo sysctl -w kern.maxfilesperproc=131072 || true
          ulimit -n 65536 || ulimit -n 10240
          echo "descriptors: $(ulimit -n) soft, kernel cap $(sysctl -n kern.maxfilesperproc)"
          npm run dist -- --publish never

      - name: Build installers
        if: runner.os != 'macOS'
        run: npm run dist -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14

  # Nothing reaches a release without having been installed and launched first.
  smoke:
    name: Smoke test
    needs: build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/smoke.yml
    with:
      run_id: ${{ github.run_id }}

  release:
    name: Publish release
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach installers to the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
